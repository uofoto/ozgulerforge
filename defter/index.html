<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E6F68">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Defter</title>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#EEF1F4;--sf:#fff;--ink:#17202B;--mute:#667385;--line:#DDE3EA;--ac:#0E6F68;--acin:#fff;--hero:#17323A;--heroin:#F2F7F6;--t0:#E3F1EE;--t1:#E8ECF8;--t2:#F6EBDD;--t3:#F3E5EC;--fs:1;
--serif:'Newsreader',Georgia,'Times New Roman',serif;--sans:'Instrument Sans',system-ui,-apple-system,'Segoe UI',sans-serif;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F151B;--sf:#18212A;--ink:#E8EDF2;--mute:#8E9BAA;--line:#26313C;--ac:#4FC3B8;--acin:#06211F;--hero:#1D3A42;--heroin:#EAF5F3;--t0:#17332F;--t1:#1D2440;--t2:#3A2E1C;--t3:#3A1F2D;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0F151B;--sf:#18212A;--ink:#E8EDF2;--mute:#8E9BAA;--line:#26313C;--ac:#4FC3B8;--acin:#06211F;--hero:#1D3A42;--heroin:#EAF5F3;--t0:#17332F;--t1:#1D2440;--t2:#3A2E1C;--t3:#3A1F2D;color-scheme:dark}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:calc(16px*var(--fs))/1.5 var(--sans);min-height:100vh;padding-top:env(safe-area-inset-top,0px)}
button,input,textarea{font:inherit;color:inherit}button{cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.wrap{max-width:900px;margin:0 auto;padding:0 14px 150px}
.top{display:flex;justify-content:space-between;align-items:center;padding:16px 0 10px}
.top h1{margin:0;font:500 26px/1.1 var(--serif)}.top small{color:var(--mute);font-size:13px}
.hero{background:var(--hero);color:var(--heroin);border-radius:24px;padding:22px 22px 16px;margin:6px 0 14px}
.hero small{opacity:.8;font-size:13px}.hero blockquote{margin:10px 0 12px;font:400 clamp(20px,4.4vw,28px)/1.3 var(--serif);max-width:36ch}
.hero .by{display:flex;justify-content:space-between;align-items:center;font-size:14px;gap:10px}
.hero button{background:rgba(255,255,255,.15);border-radius:99px;padding:6px 13px;font-size:13.5px}
.search{display:flex;align-items:center;gap:8px;background:var(--sf);border:1px solid var(--line);border-radius:14px;padding:0 14px;height:44px;margin-bottom:10px}
.search input{flex:1;border:0;background:none;outline:0;min-width:0;height:100%}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 12px;scrollbar-width:none}
.chip{white-space:nowrap;padding:6px 14px;border-radius:99px;border:1px solid var(--line);background:var(--sf);font-size:14px;color:var(--mute)}
.chip[aria-pressed="true"]{background:var(--ac);border-color:var(--ac);color:var(--acin)}
.grid{columns:2 160px;column-gap:12px}
.card{break-inside:avoid;background:var(--sf);border:1px solid var(--line);border-radius:18px;padding:14px 14px 12px;margin:0 0 12px;cursor:pointer;position:relative}
.card.mk{border-left:4px solid var(--ac)}
.card h3{margin:0 26px 6px 0;font:500 13px var(--sans);color:var(--mute)}
.card .q{font:400 17px/1.4 var(--serif);margin:0 0 8px}.card .ex{font-size:14.5px;margin:0 0 8px}
.card .w{font-size:13px;color:var(--mute);margin:0 0 8px}
.tag{display:inline-block;font-size:12px;padding:2px 9px;border-radius:99px}
.star{position:absolute;top:8px;right:8px;width:32px;height:32px;display:grid;place-items:center;color:var(--mute)}
.star.on{color:#D9A21B}.star.on svg{fill:currentColor}
.empty{text-align:center;color:var(--mute);padding:40px 10px}
.bn{background:var(--t2);border-radius:14px;padding:10px 14px;font-size:14px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;gap:10px}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--sf);border-top:1px solid var(--line);display:flex;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));z-index:5}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;color:var(--mute);padding:4px}
nav button[aria-current="page"]{color:var(--ac);font-weight:600}
.fab{position:fixed;right:max(16px,calc(50% - 440px));bottom:calc(78px + env(safe-area-inset-bottom,0px));width:56px;height:56px;border-radius:18px;background:var(--ac);color:var(--acin);display:grid;place-items:center;box-shadow:0 8px 22px rgba(0,0,0,.22);z-index:6}
.panel{background:var(--sf);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px}
.panel h2{margin:0 0 4px;font:500 19px var(--serif)}.panel p{margin:0 0 12px;color:var(--mute);font-size:14px}
.row{display:flex;gap:10px;justify-content:flex-end;align-items:center;flex-wrap:wrap}
.btn{padding:10px 18px;border-radius:12px;background:var(--ac);color:var(--acin);font-weight:600}
.btn.g{background:none;color:var(--mute);font-weight:500;border:1px solid var(--line)}.btn.d{background:none;color:#C0392B;font-weight:500;margin-right:auto}
.seg{display:flex;background:var(--bg);border-radius:12px;padding:4px;margin-bottom:12px}
.seg button{flex:1;padding:7px;border-radius:9px;color:var(--mute);font-size:14px}
.seg button[aria-pressed="true"]{background:var(--sf);color:var(--ink);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.12)}
dialog{border:0;padding:0;background:var(--sf);color:var(--ink);border-radius:24px;width:min(540px,94vw);max-height:92vh}
dialog::backdrop{background:rgba(10,15,20,.5)}
.sheet{padding:20px;display:flex;flex-direction:column;gap:10px}.sheet h2{margin:0;font:500 21px var(--serif)}
.f{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
textarea.f{min-height:120px;resize:vertical;font:17px/1.45 var(--serif)}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:12px;font-size:14px;z-index:20}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<button class="fab" id="add" aria-label="Yeni not"></button>
<nav id="nav"></nav>
<dialog id="ed"><div class="sheet">
  <h2 id="edt">Yeni not</h2>
  <div class="seg" id="kseg"><button data-k="soz" aria-pressed="true">Özlü söz</button><button data-k="makale" aria-pressed="false">Makale</button></div>
  <input class="f" id="title" placeholder="Başlık" aria-label="Başlık">
  <textarea class="f" id="body" placeholder="Sözü yaz" aria-label="Metin"></textarea>
  <input class="f" id="who" placeholder="Kime ait? (yazar, kaynak)" aria-label="Yazar">
  <input class="f" id="url" placeholder="Bağlantı (https://…)" aria-label="Bağlantı" hidden>
  <input class="f" id="tag" list="tags" placeholder="Etiket" aria-label="Etiket"><datalist id="tags"></datalist>
  <label id="rdl" hidden style="font-size:14px"><input type="checkbox" id="rd"> Okudum</label>
  <div class="row"><button class="btn d" id="del" hidden>Çöpe taşı</button><button class="btn g" id="cancel">Vazgeç</button><button class="btn" id="save">Kaydet</button></div>
</div></dialog>
<input type="file" id="file" accept="application/json,.json" hidden>
<script>
const KEY='defter-v1',P={home:'M3 11l9-8 9 8M5 10v10h14V10',arc:'M3 4h18v4H3zM5 8v12h14V8M10 12h4',cloud:'M7 18a4 4 0 0 1-.5-8 6 6 0 0 1 11.5 1.5A3.5 3.5 0 0 1 17.5 18z',set:'M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0',plus:'M12 5v14M5 12h14',star:'M12 3l2.8 5.8 6.2.9-4.5 4.4 1 6.2L12 17.3 6.5 20.3l1-6.2L3 9.7l6.2-.9z',search:'M11 4a7 7 0 1 0 0 14 7 7 0 0 0 0-14zM21 21l-5-5'};
const ic=n=>{const s=document.createElementNS('http://www.w3.org/2000/svg','svg');s.setAttribute('viewBox','0 0 24 24');s.setAttribute('class','i');s.setAttribute('aria-hidden','true');const p=document.createElementNS(s.namespaceURI,'path');p.setAttribute('d',P[n]);s.append(p);return s};
const $=s=>document.querySelector(s);
function el(t,c,x){const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}
let D={notes:[],set:{theme:'auto',size:1,time:'09:00'},lastBackup:0};
try{const r=JSON.parse(localStorage.getItem(KEY)||'null');if(r)D=Object.assign(D,r)}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(D))}catch(e){}};
let view='home',tag='Tümü',q='',sub='fav',cur=null,kind='soz',hi=0;
function toast(m){const d=el('div','toast',m);document.body.append(d);setTimeout(()=>d.remove(),1800)}
function applySet(){const r=document.documentElement,t=D.set.theme;if(t==='auto')r.removeAttribute('data-theme');else r.setAttribute('data-theme',t);r.style.setProperty('--fs',D.set.size)}
const live=()=>D.notes.filter(n=>!n.d);
const tags=()=>[...new Set(live().map(n=>n.g).filter(Boolean))];
const tint=g=>'var(--t'+(Math.max(0,tags().indexOf(g))%4)+')';
function card(n){
  const c=el('div','card'+(n.k==='makale'?' mk':''));c.tabIndex=0;c.setAttribute('role','button');
  if(n.t)c.append(el('h3','',n.t));
  c.append(el('p',n.k==='soz'?'q':'ex',n.b.length>200?n.b.slice(0,200)+'…':n.b));
  if(n.w)c.append(el('p','w',n.w));
  if(n.g){const t=el('span','tag',n.g);t.style.background=tint(n.g);c.append(t)}
  if(!n.d){const s=el('button','star'+(n.f?' on':''));s.setAttribute('aria-label','Favori');s.append(ic('star'));s.onclick=e=>{e.stopPropagation();n.f=!n.f;n.m=Date.now();save();render()};c.append(s)}
  c.onclick=()=>openEd(n);c.onkeydown=e=>{if(e.key==='Enter')openEd(n)};return c}
function grid(list,msg){const g=el('div','grid');list.forEach(n=>g.append(card(n)));const w=el('div');w.append(g);if(!list.length)w.append(el('div','empty',msg));return w}
function hero(){
  const h=el('section','hero'),qs=live().filter(n=>n.k==='soz'),fv=qs.filter(n=>n.f),pool=fv.length?fv:qs;
  h.append(el('small','',new Date().toLocaleDateString('tr-TR',{day:'numeric',month:'long'})+' · Günün sözü'));
  if(!pool.length){h.append(el('blockquote','','İlk özlü sözünü ekle, burada her gün biri karşına çıksın.'));return h}
  const n=pool[(Math.floor(Date.now()/864e5)+hi)%pool.length];
  h.append(el('blockquote','',n.b));const by=el('div','by');by.append(el('span','',n.w||n.t||''));
  const b=el('button','','Rastgele söz');b.onclick=()=>{hi=Math.floor(Math.random()*pool.length)+1;render()};by.append(b);h.append(by);return h}
function home(a){
  a.append(hero());
  const days=(Date.now()-D.lastBackup)/864e5;
  if(live().length&&days>7){const b=el('div','bn');b.append(el('span','',D.lastBackup?Math.floor(days)+' gündür yedek almadın.':'Henüz yedek almadın.'));const x=el('button','btn','Yedeğe git');x.onclick=()=>go('bak');b.append(x);a.append(b)}
  const s=el('label','search');s.append(ic('search'));const i=el('input');i.type='search';i.placeholder='Söz, yazar veya makale ara';i.value=q;i.setAttribute('aria-label','Ara');
  const out=el('div');i.oninput=()=>{q=i.value;out.replaceChildren(list())};s.append(i);a.append(s);
  const c=el('div','chips');['Tümü',...tags()].forEach(t=>{const b=el('button','chip',t);b.setAttribute('aria-pressed',t===tag);b.onclick=()=>{tag=t;render()};c.append(b)});a.append(c);
  out.append(list());a.append(out)}
function list(){const s=q.trim().toLocaleLowerCase('tr');
  const r=live().filter(n=>(tag==='Tümü'||n.g===tag)&&(!s||[n.t,n.b,n.w,n.g].join(' ').toLocaleLowerCase('tr').includes(s))).sort((a,b)=>b.c-a.c);
  return grid(r,live().length?'Sonuç yok. Aramayı değiştir.':'Henüz not yok. Sağ alttaki düğmeyle ilk notunu ekle.')}
function segs(a,items,val,fn){const s=el('div','seg');items.forEach(([v,l])=>{const b=el('button','',l);b.setAttribute('aria-pressed',v==val);b.onclick=()=>fn(v);s.append(b)});a.append(s)}
function arc(a){
  const h=el('div','top');h.append(el('h1','','Arşiv'));a.append(h);
  segs(a,[['fav','Favoriler'],['trash','Çöp kutusu']],sub,v=>{sub=v;render()});
  if(sub==='fav')a.append(grid(live().filter(n=>n.f).sort((a,b)=>b.m-a.m),'Henüz favorin yok. Kartın köşesindeki yıldıza dokun.'));
  else a.append(grid(D.notes.filter(n=>n.d).sort((a,b)=>b.d-a.d),'Çöp kutusu boş.'))}
function bak(a){
  const h=el('div','top');h.append(el('h1','','Yedek'));a.append(h);
  const p=el('div','panel');p.append(el('h2','','Bu cihaza yedekle'));
  p.append(el('p','',D.lastBackup?'Son yedek: '+new Date(D.lastBackup).toLocaleString('tr-TR'):'Henüz yedek almadın.'));
  const r=el('div','row'),b1=el('button','btn','Yedeği indir'),b2=el('button','btn g','Yedekten geri yükle');b1.onclick=exp;b2.onclick=()=>$('#file').click();r.append(b2,b1);p.append(r);a.append(p);
  const c=el('div','panel');c.append(el('h2','','Cloudflare yedeği'));c.append(el('p','','Yedeğini şifreli olarak buluta gönderip oradan geri alacaksın. Bu özellik bir sonraki adımda eklenecek.'));a.append(c)}
function sett(a){
  const h=el('div','top');h.append(el('h1','','Ayarlar'));a.append(h);
  const p=el('div','panel');p.append(el('h2','','Görünüm'));
  segs(p,[['auto','Otomatik'],['light','Açık'],['dark','Koyu']],D.set.theme,v=>{D.set.theme=v;save();applySet();render()});
  p.append(el('p','','Yazı boyutu'));segs(p,[[0.9,'Küçük'],[1,'Normal'],[1.15,'Büyük']],D.set.size,v=>{D.set.size=v;save();applySet();render()});a.append(p);
  const r=el('div','panel');r.append(el('h2','','Günün sözü hatırlatıcısı'));r.append(el('p','','Saati seç. Bildirimler bir sonraki adımda çalışacak.'));
  const t=el('input','f');t.type='time';t.value=D.set.time;t.style.width='auto';t.setAttribute('aria-label','Saat');t.onchange=()=>{D.set.time=t.value;save();toast('Saat kaydedildi')};r.append(t);a.append(r)}
function render(){
  const a=$('#app');a.replaceChildren();
  if(view==='home'){const h=el('div','top'),d=el('div');d.append(el('h1','','Defter'),el('small','','Biriktirdiklerin burada'));h.append(d);a.append(h);home(a)}
  else if(view==='arc')arc(a);else if(view==='bak')bak(a);else sett(a);
  const n=$('#nav');n.replaceChildren();
  [['home','Ana sayfa','home'],['arc','Arşiv','arc'],['bak','Yedek','cloud'],['set','Ayarlar','set']].forEach(([v,l,i])=>{const b=el('button');b.append(ic(i),el('span','',l));if(v===view)b.setAttribute('aria-current','page');b.onclick=()=>go(v);n.append(b)});
  $('#tags').replaceChildren(...tags().map(t=>{const o=el('option');o.value=t;return o}));
  $('#add').hidden=view==='bak'||view==='set'}
function go(v){view=v;render();scrollTo(0,0)}
function setKind(k){kind=k;document.querySelectorAll('#kseg button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.k===k));$('#url').hidden=$('#rdl').hidden=k!=='makale';$('#body').placeholder=k==='soz'?'Sözü yaz':'Makale notunu ya da özetini yaz'}
document.querySelectorAll('#kseg button').forEach(b=>b.onclick=()=>setKind(b.dataset.k));
function openEd(n){cur=n||null;$('#edt').textContent=n?(n.d?'Çöp kutusundaki not':'Notu düzenle'):'Yeni not';
  $('#title').value=n?n.t:'';$('#body').value=n?n.b:'';$('#who').value=n?n.w:'';$('#url').value=n&&n.u||'';$('#rd').checked=!!(n&&n.r);$('#tag').value=n?n.g:(tag!=='Tümü'?tag:'');
  setKind(n?n.k:'soz');const d=$('#del');d.hidden=!n;d.textContent=n&&n.d?'Kalıcı sil':'Çöpe taşı';$('#save').textContent=n&&n.d?'Geri al':'Kaydet';$('#ed').showModal()}
$('#add').onclick=()=>openEd();$('#add').append(ic('plus'));
$('#cancel').onclick=()=>$('#ed').close();
$('#save').onclick=()=>{
  if(cur&&cur.d){delete cur.d;cur.m=Date.now();save();$('#ed').close();render();toast('Geri alındı');return}
  const b=$('#body').value.trim();if(!b){toast('Metin boş olamaz');return}
  const u=$('#url').value.trim(),o={k:kind,t:$('#title').value.trim(),b,w:$('#who').value.trim(),g:$('#tag').value.trim(),u:kind==='makale'?u:'',r:kind==='makale'&&$('#rd').checked?(cur&&cur.r||Date.now()):0,m:Date.now()};
  if(cur)Object.assign(cur,o);else D.notes.push({id:Date.now(),c:Date.now(),f:false,...o});
  save();$('#ed').close();render();toast('Kaydedildi')};
$('#del').onclick=()=>{if(cur.d)D.notes=D.notes.filter(n=>n!==cur);else cur.d=Date.now();save();$('#ed').close();render();toast(cur.d?'Çöpe taşındı':'Kalıcı olarak silindi')};
function exp(){const j=JSON.stringify({app:'defter',v:1,date:new Date().toISOString(),notes:D.notes,set:D.set},null,1);
  const a=el('a');a.href=URL.createObjectURL(new Blob([j],{type:'application/json'}));a.download='defter-yedek-'+new Date().toISOString().slice(0,10)+'.json';document.body.append(a);a.click();a.remove();
  D.lastBackup=Date.now();save();render();toast('Yedek indirildi')}
$('#file').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>{try{const j=JSON.parse(r.result);if(j.app!=='defter'||!Array.isArray(j.notes))throw 0;
    const m=new Map(D.notes.map(n=>[n.id,n]));j.notes.forEach(n=>{const o=m.get(n.id);if(!o||(n.m||0)>(o.m||0))m.set(n.id,n)});
    D.notes=[...m.values()];save();render();toast(j.notes.length+' not işlendi')}catch(x){toast('Bu dosya bir Defter yedeği değil')}e.target.value=''};r.readAsText(f)};
if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost'))navigator.serviceWorker.register('sw.js').catch(()=>{});
applySet();render();
</script>
</body>
</html>
