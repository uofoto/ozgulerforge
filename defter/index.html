<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E6F68">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Defter</title>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="wrap" id="app"></div>
<button class="fab" id="add" aria-label="Yeni not"></button>
<nav id="nav"></nav>
<dialog id="ed"><div class="sheet">
  <h2 id="edt">Yeni not</h2>
  <div class="seg" id="kseg"><button type="button" data-k="soz" aria-pressed="true">Özlü söz</button><button type="button" data-k="makale" aria-pressed="false">Makale</button></div>
  <input class="f" id="title" placeholder="Başlık" aria-label="Başlık">
  <textarea class="f" id="body" maxlength="50000" placeholder="Sözü yaz" aria-label="Metin"></textarea>
  <input class="f" id="who" placeholder="Kime ait? (yazar, kaynak)" aria-label="Yazar">
  <input class="f" id="url" type="url" placeholder="Bağlantı (https://…)" aria-label="Bağlantı" hidden>
  <input class="f" id="tag" list="tags" placeholder="Etiket" aria-label="Etiket"><datalist id="tags"></datalist>
  <div id="rdrow" class="rdrow" hidden>
    <label style="font-size:14px;display:inline-flex;align-items:center;gap:6px;cursor:pointer"><input type="checkbox" id="rd"> Okudum</label>
    <small id="rddate" style="color:var(--mute);font-size:12.5px"></small>
  </div>
  <div class="row"><button type="button" class="btn d" id="del" hidden>Çöpe taşı</button><button type="button" class="btn g" id="cancel">Vazgeç</button><button type="button" class="btn" id="save">Kaydet</button></div>
</div></dialog>
<input type="file" id="file" accept="application/json,.json" hidden>
<script src="js/store.js"></script>
<script src="js/views.js"></script>
<script src="js/backup.js"></script>
<script src="js/app.js"></script>
</body>
</html>
