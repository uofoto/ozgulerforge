<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Video İndirici</title>
<meta name="description" content="Tweet bağlantısından videoyu indir.">
<meta name="theme-color" content="#0f1419">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Video İndir">
<style>
  :root{
    --bg:#f6f7f9; --card:#ffffff; --text:#14181f; --muted:#667085;
    --line:#e3e6eb; --accent:#1d6fe8; --accent-text:#fff; --danger:#c0362c;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#0f1419; --card:#171d25; --text:#eef1f5; --muted:#8b95a5;
      --line:#262f3a; --accent:#4c93ff; --accent-text:#0b1220; --danger:#ff7b72;
    }
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    background:var(--bg); color:var(--text);
    font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    padding:max(16px,env(safe-area-inset-top)) 16px max(24px,env(safe-area-inset-bottom));
    min-height:100vh;
  }
  main{max-width:560px;margin:0 auto}
  h1{font-size:22px;margin:8px 0 4px}
  .sub{color:var(--muted);margin:0 0 20px;font-size:14px}
  form{display:flex;flex-direction:column;gap:10px}
  .field{display:flex;gap:8px}
  input[type=text]{
    flex:1;min-width:0;padding:13px 14px;font-size:16px;color:var(--text);
    background:var(--card);border:1px solid var(--line);border-radius:12px;outline:none;
  }
  input[type=text]:focus{border-color:var(--accent)}
  button{
    font:inherit;font-weight:600;border:0;border-radius:12px;padding:13px 16px;
    cursor:pointer;background:var(--accent);color:var(--accent-text);
  }
  button.ghost{background:transparent;color:var(--text);border:1px solid var(--line);font-weight:500}
  button:disabled{opacity:.6;cursor:default}
  #status{min-height:22px;margin:14px 2px 0;font-size:14px;color:var(--muted)}
  #status.err{color:var(--danger)}
  .card{
    background:var(--card);border:1px solid var(--line);border-radius:14px;
    overflow:hidden;margin-top:14px;
  }
  .card .thumb{width:100%;aspect-ratio:16/9;object-fit:cover;background:#000;display:block}
  .card .body{padding:12px 14px;display:flex;flex-direction:column;gap:10px}
  .meta{font-size:14px;color:var(--muted)}
  .meta b{color:var(--text);font-weight:600}
  .actions{display:flex;gap:8px}
  .actions{flex-wrap:wrap}
  .actions button{flex:1}
  a.linkbtn{
    flex-basis:100%;text-align:center;text-decoration:none;font-weight:600;
    background:var(--accent);color:var(--accent-text);border-radius:12px;padding:13px 16px;
  }
  #installRow{margin-top:20px;display:none}
  #iosHint{margin-top:20px;font-size:13px;color:var(--muted);display:none}
  footer{margin-top:28px;font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<main>
  <h1>Video İndirici</h1>
  <p class="sub">Tweet bağlantısını yapıştır, videoyu cihazına kaydet.</p>

  <form id="form" autocomplete="off">
    <div class="field">
      <input id="url" type="text" inputmode="url" placeholder="https://x.com/kullanici/status/123…" aria-label="Tweet bağlantısı">
      <button type="button" id="paste" class="ghost">Yapıştır</button>
    </div>
    <button type="submit" id="go">Videoyu bul</button>
  </form>

  <div id="status" role="status" aria-live="polite"></div>
  <div id="results"></div>

  <div id="installRow"><button id="install" class="ghost" style="width:100%">Uygulamayı ana ekrana ekle</button></div>
  <div id="iosHint">iPhone'da: Paylaş simgesi → “Ana Ekrana Ekle”.</div>

  <footer>Sadece indirme hakkın olan içerikler için kullan. Videolar kaynağın sahibine aittir.</footer>
</main>
<script src="app.js"></script>
</body>
</html>
