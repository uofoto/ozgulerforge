<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Foto Ritim</title>
<meta name="description" content="Fotoğraflarını müziğin ritmine göre videoya çevir. Çevrimdışı çalışır, dosyalar cihazından çıkmaz.">
<meta name="theme-color" content="#fbf8f4">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Foto Ritim">
<style>
:root{--bg:#fbf8f4;--panel:#fff;--line:#e6ddd1;--tx:#241f1c;--mu:#7c7167;--ac:#b8864b;--ac-bg:#f6ecdf;color-scheme:light}
@media(prefers-color-scheme:dark){:root{--bg:#141210;--panel:#1d1a17;--line:#332d27;--tx:#f2ece4;--mu:#9e9285;--ac:#d4a05c;--ac-bg:#2e251b;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:max(16px,env(safe-area-inset-top)) 16px max(24px,env(safe-area-inset-bottom))}
main{max-width:960px;margin:0 auto;display:grid;gap:16px}
@media(min-width:820px){main{grid-template-columns:1fr 1fr;align-items:start}header,footer{grid-column:1/-1}.stage{position:sticky;top:16px}}
header{display:flex;align-items:center;justify-content:space-between;gap:12px}
h1{font:500 1.5rem Georgia,serif;margin:0}
h2{font:500 1.05rem Georgia,serif;margin:0 0 10px;display:flex;justify-content:space-between;align-items:center}
.stage{display:grid;gap:10px;justify-items:center}
#cv{max-width:100%;max-height:60vh;background:#000;border-radius:14px;display:block}
#tl{width:100%;height:44px;border-radius:8px;background:var(--panel);border:1px solid var(--line);cursor:pointer;display:block}
.box{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
button,.btn,select{font:inherit;color:var(--tx);background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:9px 14px;cursor:pointer;font-weight:600}
select{font-weight:400;width:100%}
button:disabled{opacity:.4;cursor:default}
button:focus-visible,select:focus-visible,.btn:focus-within{outline:2px solid var(--ac);outline-offset:2px}
.main{background:var(--tx);color:var(--bg);border-color:var(--tx)}
.gold{background:var(--ac);border-color:var(--ac);color:#fff}
.btn{position:relative;overflow:hidden;display:inline-block}
.btn input{position:absolute;inset:0;opacity:0;cursor:pointer;font-size:100px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
label.f{display:grid;gap:4px;font-size:.82rem;color:var(--mu)}
label.c{display:flex;gap:8px;align-items:center;margin-top:10px;cursor:pointer}
label.c input{accent-color:var(--ac);width:16px;height:16px}
.note{font-size:.85rem;color:var(--mu);margin:8px 0 0}
#th{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.t{position:relative;width:60px;height:60px;border-radius:8px;overflow:hidden;border:1px solid var(--line)}
.t img{width:100%;height:100%;object-fit:cover}
.t button{position:absolute;top:0;right:0;padding:0 6px;border:0;border-radius:0 0 0 8px;background:rgba(0,0,0,.7);color:#fff;font-size:.8rem}
.badge{font:700 .7rem system-ui;background:var(--ac-bg);color:var(--ac);padding:2px 8px;border-radius:99px}
progress{width:100%;height:6px;accent-color:var(--ac)}progress[hidden]{display:none}
#st{text-align:center;font-size:.9rem;min-height:1.3em}.err{color:#dc2626}.ok{color:#16a34a}
#out{text-align:center;width:100%}#out video{display:block;width:min(100%,360px);max-height:50vh;margin:10px auto;border-radius:10px;background:#000}
footer{text-align:center;color:var(--mu);font-size:.8rem}footer a{color:var(--ac)}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--panel);border:1px solid var(--ac);border-radius:12px;padding:10px 16px;display:none;gap:10px;align-items:center;box-shadow:0 8px 28px rgba(0,0,0,.25)}
</style>
</head>
<body>
<main>
<header>
  <h1>Foto Ritim</h1>
  <div class="row"><span id="net" class="note" style="margin:0"></span><button id="inst" hidden>⤓ Yükle</button></div>
</header>

<section class="stage">
  <canvas id="cv" width="1080" height="1920"></canvas>
  <canvas id="tl" aria-label="Zaman çizelgesi"></canvas>
  <progress id="pg" value="0" max="1" hidden></progress>
  <div class="row">
    <button id="play" class="main" disabled>▶ Önizle</button>
    <button id="rec" class="gold" disabled>🎬 Videoyu kaydet</button>
  </div>
  <div id="st" role="status"></div>
  <div id="out"></div>
</section>

<section>
  <div class="box">
    <h2>1. Fotoğraflar <span id="cnt" class="badge">0</span></h2>
    <div class="row">
      <label class="btn main">+ Fotoğraf ekle<input id="pics" type="file" accept="image/*" multiple></label>
      <button id="shuf" disabled>🔀 Karıştır</button>
      <button id="clr" disabled>Temizle</button>
    </div>
    <div id="th"></div>
  </div>

  <div class="box">
    <h2>2. Müzik</h2>
    <div class="row"><label class="btn main">🎵 Müzik seç<input id="aud" type="file" accept="audio/*"></label></div>
    <p id="ainfo" class="note">MP3, M4A, WAV, OGG. Dosyaları sayfaya sürükleyip de bırakabilirsin.</p>
  </div>

  <div class="box">
    <h2>3. Ayarlar</h2>
    <div class="grid">
      <label class="f">Biçim
        <select id="fmt"><option value="9x16">Dikey 9:16 (Reels / TikTok)</option><option value="1x1">Kare 1:1</option><option value="16x9">Yatay 16:9</option></select></label>
      <label class="f">Kalite
        <select id="q"><option value="720">720p</option><option value="1080" selected>1080p</option></select></label>
      <label class="f">Kadraj
        <select id="fit"><option value="blur">Kırpmadan (bulanık dolgu)</option><option value="fill">Doldur (ortadan kırp)</option></select></label>
      <label class="f">Geçiş
        <select id="tr"><option value="mix">Karışık</option><option value="fade">Yumuşak</option><option value="zoom">Yakınlaş</option><option value="slide">Kaydır</option><option value="cut">Sert kesme</option></select></label>
      <label class="f">Kesim hızı
        <select id="pace"><option value="1.5">Hızlı (~1.5 sn)</option><option value="2.5" selected>Dengeli (~2.5 sn)</option><option value="4">Sakin (~4 sn)</option></select></label>
      <label class="f">Süre
        <select id="dur"><option value="0">Tüm şarkı</option><option value="15">En hareketli 15 sn</option><option value="30">En hareketli 30 sn</option><option value="60">En hareketli 60 sn</option></select></label>
    </div>
    <label class="c"><input id="kb" type="checkbox" checked> Yavaş kayma / yakınlaşma</label>
    <label class="c"><input id="zm" type="checkbox" checked> Vuruşta hafif nabız</label>
    <label class="c"><input id="fd" type="checkbox" checked> Başta ve sonda yumuşak giriş/çıkış</label>
  </div>
</section>

<footer>
  Tüm işlemler cihazında yapılır; hiçbir dosya sunucuya gönderilmez. Yüklediğin içeriklerin telif sorumluluğu sana aittir.<br>
  <a href="https://ozgulerforge.com.tr" target="_blank" rel="noopener">Özgüler Forge</a> · <span id="ver"></span>
</footer>
</main>
<div id="toast"><span id="tm"></span></div>

<script>
const VER = 'v4.0';
const $ = id => document.getElementById(id);
const cv = $('cv'), cx = cv.getContext('2d'), tl = $('tl'), tx = tl.getContext('2d');
let imgs = [], buf = null, AC = null, beats = [], bpm = 0, env = null, ON = null, fps = 0;
let segs = [], BS = [], t0 = 0, t1 = 0, pf = 0, ctx0 = 0, src = null, raf = 0;
let playing = false, recMode = false, mr = null, chunks = [], fin = false, url = null, wl = null;

const say = (m, c) => { const s = $('st'); s.textContent = m || ''; s.className = c || ''; };
const mmss = v => { v = Math.max(0, Math.round(v)); return (v / 60 | 0) + ':' + String(v % 60).padStart(2, '0'); };
let tt; const toast = m => { clearTimeout(tt); $('tm').textContent = m; $('toast').style.display = 'flex'; tt = setTimeout(() => $('toast').style.display = 'none', 3000); };

// ---------- Ayarlar (otomatik hatırlanır) ----------
const SEL = ['fmt', 'q', 'fit', 'tr', 'pace', 'dur'], CHK = ['kb', 'zm', 'fd'];
function save() { try { localStorage.fr4 = JSON.stringify([...SEL.map(i => $(i).value), ...CHK.map(i => $(i).checked)]); } catch (e) { } }
function load() {
  try {
    const a = JSON.parse(localStorage.fr4 || 'null'); if (!a) return;
    SEL.forEach((i, n) => { if (a[n] != null) $(i).value = a[n]; });
    CHK.forEach((i, n) => { if (a[SEL.length + n] != null) $(i).checked = a[SEL.length + n]; });
  } catch (e) { }
}
function size() {
  const [a, b] = $('fmt').value.split('x').map(Number), q = +$('q').value, e = v => Math.round(v / 2) * 2;
  cv.width = a > b ? e(q * a / b) : q; cv.height = a < b ? e(q * b / a) : q;
}
[...SEL, ...CHK].forEach(id => $(id).onchange = () => { if (id === 'fmt' || id === 'q') size(); save(); build(); });

// ---------- Fotoğraflar ----------
async function addFiles(files) {
  const list = [...files].filter(f => f.type.startsWith('image/')); if (!list.length) return;
  say('Fotoğraflar yükleniyor…'); let bad = 0;
  for (const f of list) {
    try {
      let b = await createImageBitmap(f); const m = Math.max(b.width, b.height);
      if (m > 3072) { const r = 3072 / m, c = document.createElement('canvas'); c.width = Math.round(b.width * r); c.height = Math.round(b.height * r); c.getContext('2d').drawImage(b, 0, 0, c.width, c.height); b.close(); b = await createImageBitmap(c); }
      const g = document.createElement('canvas'), z = 40 / Math.max(b.width, b.height);
      g.width = Math.max(1, Math.round(b.width * z)); g.height = Math.max(1, Math.round(b.height * z)); g.getContext('2d').drawImage(b, 0, 0, g.width, g.height);
      imgs.push({ b, g, u: URL.createObjectURL(f) });
    } catch (e) { bad++; }
  }
  thumbs(); build();
  if (bad) say(bad + ' dosya açılamadı.', 'err');
}
function thumbs() {
  const t = $('th'); t.textContent = ''; $('cnt').textContent = imgs.length;
  imgs.forEach((it, i) => {
    const d = document.createElement('div'), g = document.createElement('img'), x = document.createElement('button');
    d.className = 't'; g.src = it.u; g.alt = 'Fotoğraf ' + (i + 1); x.textContent = '×'; x.title = 'Kaldır';
    x.onclick = () => { stop(); const r = imgs.splice(i, 1)[0]; r.b.close(); URL.revokeObjectURL(r.u); thumbs(); build(); };
    d.append(g, x); t.appendChild(d);
  });
  $('shuf').disabled = imgs.length < 2; $('clr').disabled = !imgs.length;
}
$('pics').onchange = e => { addFiles(e.target.files); e.target.value = ''; };
$('shuf').onclick = () => { stop(); for (let i = imgs.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0;[imgs[i], imgs[j]] = [imgs[j], imgs[i]]; } thumbs(); build(); };
$('clr').onclick = () => { stop(); imgs.forEach(r => { r.b.close(); URL.revokeObjectURL(r.u); }); imgs = []; thumbs(); build(); };

// ---------- Müzik ve ritim analizi ----------
async function loadAudio(f) {
  stop(); say('Müzik çözülüyor ve ritim aranıyor…');
  AC = AC || new (window.AudioContext || window.webkitAudioContext)();
  try { buf = await AC.decodeAudioData(await f.arrayBuffer()); } catch (e) { buf = null; return say('Ses dosyası okunamadı.', 'err'); }
  await new Promise(r => setTimeout(r, 20));
  if (!analyze()) { beats = []; $('ainfo').textContent = ''; build(); return say('Ritim çıkarılamadı. Başka bir şarkı dene.', 'err'); }
  $('ainfo').textContent = f.name + ' · ' + mmss(buf.duration) + ' · ~' + bpm.toFixed(0) + ' BPM';
  say('Ritim bulundu ✓', 'ok'); build();
}
$('aud').onchange = e => { if (e.target.files[0]) loadAudio(e.target.files[0]); };

function analyze() {
  const sr = buf.sampleRate, d = buf.getChannelData(0), hop = Math.round(sr / 50), nf = Math.floor(d.length / hop);
  fps = sr / hop; if (nf < fps * 4) return false;
  env = new Float32Array(nf); const raw = new Float32Array(nf), a = Math.exp(-2 * Math.PI * 150 / sr);
  let lp = 0, pe = 0, pb = 0;
  for (let f = 0; f < nf; f++) {
    let e = 0, b = 0;
    for (let i = f * hop, j = i + hop; i < j; i++) { const v = d[i]; lp = a * lp + (1 - a) * v; e += v * v; b += lp * lp; }
    e = Math.sqrt(e / hop); b = Math.sqrt(b / hop);
    env[f] = e; raw[f] = Math.max(0, e - pe) + 1.5 * Math.max(0, b - pb); pe = e; pb = b;
  }
  ON = new Float32Array(nf); let mx = 0;
  for (let i = 0; i < nf; i++) {
    let s = 0, c = 0; for (let j = Math.max(0, i - 9); j <= Math.min(nf - 1, i + 9); j++) { s += raw[j]; c++; }
    ON[i] = Math.max(0, raw[i] - s / c); if (ON[i] > mx) mx = ON[i];
  }
  if (!mx) return false; for (let i = 0; i < nf; i++) ON[i] /= mx;
  const corr = lag => { const L = Math.round(lag); let c = 0, a2 = 0, b2 = 0; for (let i = L; i < nf; i++) { c += ON[i] * ON[i - L]; a2 += ON[i] ** 2; b2 += ON[i - L] ** 2; } return c / Math.sqrt(Math.max(1e-12, a2 * b2)); };
  let best = 0, bs = -1;
  for (let lag = fps * 60 / 165; lag <= fps * 60 / 75; lag += .25) {
    const tempo = fps * 60 / lag, s = corr(lag) * (.9 + .1 * Math.exp(-.12 * Math.log2(tempo / 115) ** 2));
    if (s > bs) { bs = s; best = lag; }
  }
  if (!best) return false;
  let ph = 0, ps = -1;
  for (let o = 0; o < best; o += .25) {
    let s = 0, c = 0;
    for (let t = o; t < nf; t += best) { const k = Math.round(t); let p = 0; for (let j = Math.max(0, k - 1); j <= Math.min(nf - 1, k + 1); j++) p = Math.max(p, ON[j]); s += p; c++; }
    s /= Math.max(1, c); if (s > ps) { ps = s; ph = o; }
  }
  beats = []; for (let t = ph; t < nf; t += best) beats.push(t / fps);
  bpm = fps * 60 / best; return true;
}

// En hareketli bölümün başlangıcı
function loudStart(len) {
  const w = Math.floor(len * fps), n = env.length; if (w >= n) return 0;
  let cur = 0, bestS = -1, bi = 0;
  for (let i = 0; i < n; i++) {
    cur += env[i] + ON[i] * .3; if (i >= w) cur -= env[i - w] + ON[i - w] * .3;
    if (i >= w - 1 && cur > bestS) { bestS = cur; bi = i - w + 1; }
  }
  let t = bi / fps, nb = beats.reduce((p, b) => Math.abs(b - t) < Math.abs(p - t) ? b : p, beats[0]);
  if (Math.abs(nb - t) < .6) t = nb;
  return Math.min(t, Math.max(0, buf.duration - len));
}

// ---------- Kurgu ----------
function build() {
  stop(); segs = []; BS = [];
  const ok = imgs.length && buf && beats.length;
  $('play').disabled = $('rec').disabled = !ok;
  if (!ok) { clearView(); return; }
  const len = +$('dur').value;
  t0 = len ? loudStart(len) : 0; t1 = len ? Math.min(buf.duration, t0 + len) : buf.duration;
  BS = beats.filter(b => b >= t0 && b < t1 - .3);
  if (BS.length < 2) { $('play').disabled = $('rec').disabled = true; return say('Seçilen aralıkta yeterli vuruş yok.', 'err'); }
  const iv = 60 / bpm, minS = +$('pace').value, bpp = [1, 2, 4, 8, 16].find(v => v * iv >= minS) || 16;
  const st = BS.filter((_, i) => i % bpp === 0);
  segs = st.map((t, i) => ({ a: i ? t : t0, b: i + 1 < st.length ? st[i + 1] : t1, img: i % imgs.length }));
  if (segs.length > 1 && segs.at(-1).b - segs.at(-1).a < .8) { segs.at(-2).b = t1; segs.pop(); }
  say(imgs.length + ' fotoğraf → ' + segs.length + ' kesim · ' + (t1 - t0).toFixed(0) + ' sn' + (imgs.length < segs.length ? ' (fotoğraflar tekrar eder)' : imgs.length > segs.length ? ' (bazı fotoğraflar gösterilmez)' : ''));
  draw(t0); drawTL(t0);
}
function clearView() { cx.fillStyle = '#000'; cx.fillRect(0, 0, cv.width, cv.height); if (imgs.length) put(0); drawTL(-1); }

function lastBeat(t) {
  let lo = 0, hi = BS.length - 1, r = null;
  while (lo <= hi) { const m = (lo + hi) >> 1; if (BS[m] <= t) { r = BS[m]; lo = m + 1; } else hi = m - 1; }
  return r;
}

function put(i, o = {}) {
  const it = imgs[i], W = cv.width, H = cv.height, fill = $('fit').value === 'fill', bw = it.b.width, bh = it.b.height;
  const r = (fill ? Math.max : Math.min)(W / bw, H / bh);
  cx.save(); cx.globalAlpha = o.al ?? 1; cx.translate(W / 2 + (o.dx || 0), H / 2); cx.scale(o.sc || 1, o.sc || 1);
  if (!fill) {
    const k = Math.max(W / it.g.width, H / it.g.height);
    cx.drawImage(it.g, -it.g.width * k / 2, -it.g.height * k / 2, it.g.width * k, it.g.height * k);
    cx.fillStyle = 'rgba(0,0,0,.35)'; cx.fillRect(-W / 2, -H / 2, W, H);
  }
  cx.imageSmoothingQuality = 'high'; cx.drawImage(it.b, -bw * r / 2, -bh * r / 2, bw * r, bh * r); cx.restore();
}

const MIX = ['fade', 'zoom', 'slide'];
function trans(k, p, a, b) {
  const W = cv.width, e = p * p * (3 - 2 * p);
  if (k === 'zoom') { put(a, { sc: 1 + .35 * e }); put(b, { sc: .85 + .15 * e, al: e }); }
  else if (k === 'slide') { put(a, { dx: -W * .25 * e }); put(b, { dx: W * (1 - e) }); }
  else { put(a); put(b, { al: e }); }
}

function draw(t, last) {
  cx.fillStyle = '#000'; cx.fillRect(0, 0, cv.width, cv.height);
  let k = 0; for (let i = 0; i < segs.length; i++) { if (t >= segs[i].a) k = i; else break; }
  const s = segs[k], since = t - s.a, dur = Math.max(.1, s.b - s.a), prog = Math.min(1, since / dur);
  let kind = $('tr').value; if (kind === 'mix') kind = MIX[k % MIX.length];
  const F = kind === 'cut' ? 0 : Math.min(.55, dur * .4);
  if (k > 0 && since < F) trans(kind, since / F, segs[k - 1].img, s.img);
  else {
    const lb = lastBeat(t), age = lb == null ? 9 : t - lb, imp = age < .22 ? 1 - age / .22 : 0;
    let sc = 1; if ($('kb').checked) sc += .06 * (k % 2 ? 1 - prog : prog); if ($('zm').checked) sc += .04 * imp;
    put(s.img, { sc, dx: $('kb').checked ? (prog - .5) * cv.width * .02 * (k % 2 ? -1 : 1) : 0 });
  }
  if ($('fd').checked) {
    const fd = Math.min(1.2, (t1 - t0) / 3), fi = Math.min(.6, fd);
    const a = Math.max(0, 1 - (t - t0) / fi, 1 - (t1 - t) / fd);
    if (a > 0) { cx.fillStyle = 'rgba(0,0,0,' + Math.min(1, a) + ')'; cx.fillRect(0, 0, cv.width, cv.height); }
  }
}

function drawTL(t) {
  const dpr = devicePixelRatio || 1, w = tl.clientWidth, h = tl.clientHeight;
  if (tl.width !== Math.round(w * dpr)) { tl.width = Math.round(w * dpr); tl.height = Math.round(h * dpr); }
  tx.setTransform(dpr, 0, 0, dpr, 0, 0); tx.clearRect(0, 0, w, h);
  if (!(t1 > t0) || !segs.length) return;
  const X = v => (v - t0) / (t1 - t0) * w, dark = matchMedia('(prefers-color-scheme:dark)').matches;
  segs.forEach((s, i) => { tx.fillStyle = dark ? (i % 2 ? '#2a2520' : '#221e1a') : (i % 2 ? '#f3ede5' : '#e9dfd1'); tx.fillRect(X(s.a), 0, Math.max(1, X(s.b) - X(s.a) - 1), h); });
  tx.fillStyle = '#b8864b'; segs.slice(1).forEach(s => tx.fillRect(X(s.a) - 1, 0, 2, h));
  if (t >= 0) { tx.fillStyle = dark ? '#f2ece4' : '#241f1c'; tx.fillRect(X(Math.min(t, t1)) - 1, 0, 2, h); }
}
addEventListener('resize', () => { if (!playing) drawTL(t0); });
tl.onclick = e => { if (!segs.length || (playing && recMode)) return; const r = tl.getBoundingClientRect(); start(false, Math.min(t1 - .5, t0 + (e.clientX - r.left) / r.width * (t1 - t0))); };

// ---------- Oynatma ve kayıt ----------
$('play').onclick = () => playing ? (stop(), draw(t0), drawTL(t0)) : start(false);
$('rec').onclick = () => start(true);

async function start(r, from) {
  if (!segs.length) return; stop(); await AC.resume();
  pf = r || from == null ? t0 : Math.max(t0, from);
  src = AC.createBufferSource(); src.buffer = buf;
  const g = AC.createGain(); src.connect(g); g.connect(AC.destination);
  if (r) {
    const types = ['video/mp4;codecs=avc1.42E01E,mp4a.40.2', 'video/mp4', 'video/webm;codecs=vp9,opus', 'video/webm'];
    const mt = window.MediaRecorder && types.find(t => MediaRecorder.isTypeSupported(t));
    if (!mt) return say('Bu tarayıcı video kaydını desteklemiyor. Chrome, Edge veya Safari kullan.', 'err');
    if (url) { URL.revokeObjectURL(url); url = null; } $('out').textContent = '';
    const dest = AC.createMediaStreamDestination(); g.connect(dest); draw(pf);
    let stream; try { stream = cv.captureStream(30); } catch (e) { return say('Video akışı başlatılamadı.', 'err'); }
    dest.stream.getAudioTracks().forEach(x => stream.addTrack(x));
    chunks = []; fin = false; const type = mt.split(';')[0], ext = type.includes('mp4') ? 'mp4' : 'webm';
    mr = new MediaRecorder(stream, { mimeType: mt, videoBitsPerSecond: Math.min(1e7, Math.max(4e6, cv.width * cv.height * 5)), audioBitsPerSecond: 192e3 });
    mr.ondataavailable = e => e.data.size && chunks.push(e.data);
    mr.onstop = () => { if (fin) done(new Blob(chunks, { type }), ext); };
    mr.start(1000); lock(true); say('Kaydediliyor… ekranı açık tut.');
  }
  ctx0 = AC.currentTime + .1; src.start(ctx0, pf, t1 - pf);
  if ($('fd').checked) { const tot = t1 - pf, fd = Math.min(1.2, tot / 3), fi = Math.min(.6, fd); g.gain.setValueAtTime(0, ctx0); g.gain.linearRampToValueAtTime(1, ctx0 + fi); g.gain.setValueAtTime(1, ctx0 + tot - fd); g.gain.linearRampToValueAtTime(0, ctx0 + tot); }
  playing = true; recMode = r; $('play').textContent = r ? '⏹ Kaydı iptal et' : '⏹ Durdur'; $('rec').disabled = r;
  $('pg').value = 0; $('pg').hidden = false; raf = requestAnimationFrame(frame);
}

function frame() {
  if (!playing) return;
  const t = pf + Math.max(0, AC.currentTime - ctx0); if (t >= t1 - .02) return finish();
  draw(t); drawTL(t); const tot = t1 - pf, el = Math.min(tot, t - pf); $('pg').value = el / tot;
  if (recMode) say('Kaydediliyor… %' + Math.round(el / tot * 100) + ' · kalan ≈ ' + mmss(tot - el));
  raf = requestAnimationFrame(frame);
}

function finish() {
  playing = false; cancelAnimationFrame(raf); $('play').textContent = '▶ Önizle'; draw(t1 - .03); drawTL(t1);
  if (recMode && mr && mr.state !== 'inactive') { fin = true; $('play').disabled = true; say('Video hazırlanıyor…'); setTimeout(() => mr.stop(), 500); }
  else $('pg').hidden = true;
}

function stop() {
  const wasRec = recMode && playing; playing = false; cancelAnimationFrame(raf);
  try { src && src.stop(); } catch (e) { }
  if (wasRec && mr && mr.state !== 'inactive') { fin = false; try { mr.stop(); } catch (e) { } lock(false); say('Kayıt iptal edildi.'); }
  $('play').textContent = '▶ Önizle'; $('pg').hidden = true; $('rec').disabled = !segs.length;
}

function done(blob, ext) {
  lock(false); $('pg').hidden = true; $('play').disabled = $('rec').disabled = false;
  if (blob.size < 40000) return say('Kayıt boş çıktı. 720p ile tekrar dene.', 'err');
  url = URL.createObjectURL(blob);
  const name = 'foto-ritim-' + new Date().toISOString().slice(0, 16).replace(/[-:T]/g, '') + '.' + ext;
  const o = $('out'); o.textContent = '';
  const a = document.createElement('a'); a.href = url; a.download = name; a.className = 'btn gold'; a.textContent = '⬇ İndir (' + ext.toUpperCase() + ' · ' + (blob.size / 1048576).toFixed(1) + ' MB)'; o.appendChild(a);
  const f = new File([blob], name, { type: blob.type });
  if (navigator.canShare && navigator.canShare({ files: [f] })) { const s = document.createElement('button'); s.textContent = '📤 Paylaş'; s.style.marginLeft = '8px'; s.onclick = () => navigator.share({ files: [f] }).catch(() => { }); o.appendChild(s); }
  const v = document.createElement('video'); v.controls = true; v.playsInline = true; v.src = url; o.appendChild(v);
  say('Video hazır ✓', 'ok'); draw(t0); drawTL(t0);
}

async function lock(on) { try { if (on) wl = await navigator.wakeLock.request('screen'); else if (wl) { wl.release(); wl = null; } } catch (e) { } }
document.addEventListener('visibilitychange', () => { if (document.hidden && playing && recMode) say('Uygulama arka plana geçti; kayıt bozulabilir. Geri dön.', 'err'); });
addEventListener('beforeunload', e => { if (playing && recMode) { e.preventDefault(); e.returnValue = ''; } });

// ---------- Sürükle-bırak, kısayol, PWA ----------
document.body.addEventListener('dragover', e => e.preventDefault());
document.body.addEventListener('drop', e => {
  e.preventDefault(); const f = [...e.dataTransfer.files], au = f.find(x => x.type.startsWith('audio/'));
  addFiles(f); if (au) loadAudio(au);
});
addEventListener('keydown', e => { if (e.code === 'Space' && !/INPUT|SELECT|BUTTON/.test(e.target.tagName) && !$('play').disabled) { e.preventDefault(); $('play').click(); } });

if ('serviceWorker' in navigator && location.protocol !== 'file:') {
  navigator.serviceWorker.register('sw.js').then(r => {
    r.onupdatefound = () => { const w = r.installing; w.onstatechange = () => { if (w.state === 'installed' && navigator.serviceWorker.controller) w.postMessage('skip'); }; };
  }).catch(() => { });
  let rl = false; const had = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener('controllerchange', () => { if (had && !rl && !playing) { rl = true; location.reload(); } });
}
let dp; addEventListener('beforeinstallprompt', e => { e.preventDefault(); dp = e; $('inst').hidden = false; });
$('inst').onclick = async () => { if (dp) { dp.prompt(); await dp.userChoice; dp = null; $('inst').hidden = true; } };
addEventListener('appinstalled', () => $('inst').hidden = true);
const net = () => $('net').textContent = navigator.onLine ? '' : '● Çevrimdışı';
addEventListener('online', net); addEventListener('offline', net); net();

load(); size(); $('ver').textContent = VER; clearView();
</script>
</body>
</html>
