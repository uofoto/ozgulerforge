<!doctype html>
<html lang="tr" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#36c8b0">
  <meta name="description" content="Fotoğraf, video, PDF ve QR araçları. Dosyan cihazından çıkmaz.">
  <meta name="application-name" content="Pratik">
  <meta name="author" content="Ozguler Forge">
  <link rel="canonical" href="https://ozgulerforge.com.tr/">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="stylesheet" href="/styles.css">
  <title>Pratik — Gizli Dosya Araçları | Ozguler Forge</title>
</head>
<body>
  <div class="app-frame">
    <aside class="side-rail" aria-label="Ana navigasyon">
      <a class="brand" href="#home" aria-label="Pratik ana sayfa">
        <span class="brand-mark"><img src="/manus-storage/async-images/093X6gvtsJaWHRfRi3Xper/image-1.webp" onerror="this.onerror=null;this.src='/icon.svg'" alt=""></span>
        <span class="brand-word">Pratik</span>
      </a>
      <div class="rail-label">ÇALIŞMA ALANI</div>
      <nav class="rail-nav">
        <button class="nav-item is-active" data-view="home"><span class="nav-icon">⌂</span><span>Ana sayfa</span></button>
        <button class="nav-item" data-view="tools"><span class="nav-icon">◈</span><span>Tüm araçlar</span><em id="toolCount">20</em></button>
        <button class="nav-item" data-view="history"><span class="nav-icon">◷</span><span>Geçmiş</span><em id="historyCount">0</em></button>
        <button class="nav-item" data-view="settings"><span class="nav-icon">⊙</span><span>Ayarlar</span></button>
      </nav>
      <div class="rail-spacer"></div>
      <div class="privacy-mini"><span class="status-dot"></span><div><b>Dosyan güvende</b><small>İşlemler cihazında</small></div></div>
      <div class="rail-footer">Pratik <span>v1.0</span></div>
    </aside>

    <main class="main-content">
      <header class="topbar">
        <button class="mobile-brand" data-view="home" aria-label="Ana sayfa"><span class="brand-mark"><img src="/manus-storage/async-images/093X6gvtsJaWHRfRi3Xper/image-1.webp" onerror="this.onerror=null;this.src='/icon.svg'" alt=""></span><span class="brand-word">Pratik</span></button>
        <div class="topbar-context"><span class="context-dot"></span><span id="contextText">Cihazında, gizli</span></div>
        <div class="topbar-actions">
          <button class="icon-btn" id="themeBtn" title="Temayı değiştir" aria-label="Temayı değiştir">◐</button>
          <button class="install-btn" id="installBtn" hidden><span>＋</span> Yükle</button>
          <button class="avatar-btn" data-view="settings" aria-label="Ayarlar">M</button>
        </div>
      </header>

      <div id="viewRoot" class="view-root" tabindex="-1"></div>

      <nav class="mobile-dock" aria-label="Mobil navigasyon">
        <button class="dock-item is-active" data-view="home"><span>⌂</span><small>Ana sayfa</small></button>
        <button class="dock-item" data-view="tools"><span>◈</span><small>Araçlar</small></button>
        <button class="dock-item" data-view="history"><span>◷</span><small>Geçmiş</small><i id="dockHistoryDot" hidden></i></button>
        <button class="dock-item" data-view="settings"><span>⊙</span><small>Ayarlar</small></button>
      </nav>
    </main>
  </div>

  <div id="toastRegion" class="toast-region" aria-live="polite" aria-atomic="true"></div>
  <div id="installPrompt" class="install-prompt" hidden>
    <div class="prompt-icon"><img src="/manus-storage/async-images/093X6gvtsJaWHRfRi3Xper/image-1.webp" onerror="this.onerror=null;this.src='/icon.svg'" alt=""></div><div><b>Pratik’i yükle</b><small>Ana ekranından hızlıca aç, çevrimdışı da kullan.</small></div><button id="promptInstall">Yükle</button><button class="prompt-close" id="promptClose" aria-label="Kapat">×</button>
  </div>
  <script src="/app.js"></script>
</body>
</html>
